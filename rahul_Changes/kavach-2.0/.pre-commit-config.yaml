repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix, --line-length=100]
      - id: ruff-format

  - repo: https://github.com/psf/black-pre-commit
    rev: 26.5.1
    hooks:
      - id: black
        args: [--line-length=100]
