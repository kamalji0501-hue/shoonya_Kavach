[project]
name = "datafeedbot"
version = "0.1.0"
description = "Standalone dual-broker market data service for NIFTY options"
requires-python = ">=3.10"
dependencies = [
  "dhanhq>=2.0.0",
  "kiteconnect>=5.0.0",
  "websockets>=12.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
